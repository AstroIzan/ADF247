services:
  postgres:
    image: postgres:16-alpine
    container_name: adf247-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adf247
      POSTGRES_PASSWORD: adf247
      POSTGRES_DB: adf247_dev
    ports:
      - "5432:5432"
    volumes:
      - adf247_postgres_data:/var/lib/postgresql/data

volumes:
  adf247_postgres_data:
