services:

  api:
    build:
      context: .
      dockerfile: api/Dockerfile

    container_name: adf247${DEPLOYMENT_SUFFIX:-}-api

    restart: unless-stopped

    env_file:
      - ${API_ENV_FILE:-./api/.env.pro}

    environment:
      NODE_ENV: production
      PORT: 3001
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json

    secrets:
      - source: firebase_service_account
        target: firebase-service-account.json

    networks:
      - adf247
      - homelab-database

  api-dotnet:
    profiles:
      - dotnet

    build:
      context: ./api-dotnet
      dockerfile: ADF247.Api/Dockerfile

    container_name: adf247${DEPLOYMENT_SUFFIX:-}-api-dotnet

    restart: unless-stopped

    env_file:
      - ${API_ENV_FILE:-./api/.env.pro}

    environment:
      ASPNETCORE_ENVIRONMENT: Production

    ports:
      - "127.0.0.1:${DOTNET_API_PORT:-3002}:8080"

    networks:
      - adf247
      - homelab-database

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        FIREBASE_WEB_CONFIG_JSON: ${FIREBASE_WEB_CONFIG_JSON:-}
        FIREBASE_WEB_VAPID_KEY: ${FIREBASE_WEB_VAPID_KEY:-}

    container_name: adf247${DEPLOYMENT_SUFFIX:-}-client

    restart: unless-stopped

    ports:
      - "127.0.0.1:${CLIENT_PORT:-8081}:80"

    depends_on:
      - api

    networks:
      - adf247


networks:

  adf247:
    driver: bridge
    name: adf247${DEPLOYMENT_SUFFIX:-_adf247}

  homelab-database:
    external: true
    name: homelab-database


secrets:

  firebase_service_account:
    file: ./secrets/firebase-service-account.json