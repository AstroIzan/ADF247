<div class="app-shell">
	@if (authService.isLoggedIn()) {
		<header class="top-nav">
			<div class="top-nav-left">
				<div class="logo">ADF247</div>
				<button class="nav-btn" routerLink="/home" routerLinkActive="active">Inici</button>
				@if (authService.isAdmin()) {
					<button class="nav-btn" routerLink="/dashboard" routerLinkActive="active">Panell</button>
				}
			</div>

			<div class="top-nav-right">
				<span class="mini-user">
					{{ authService.getCachedNCarnet() }}
					<span class="mini-user-detail">
						@if (authService.getCachedNIndicatiu()) {
							| {{ authService.getCachedNIndicatiu() }}
						}
						| {{ authService.getCachedName() }} {{ authService.getCachedLastName() || '' }}
					</span>
				</span>
				<button class="nav-btn profile-btn" title="Editar perfil" aria-label="Editar perfil" (click)="openProfileModal()">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
						<circle cx="12" cy="7" r="4"></circle>
					</svg>
					<span class="nav-btn-text">Perfil</span>
				</button>
				<button class="nav-btn logout" title="Sortir" aria-label="Sortir" (click)="authService.logout()">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
						<polyline points="16 17 21 12 16 7"></polyline>
						<line x1="21" y1="12" x2="9" y2="12"></line>
					</svg>
					<span class="nav-btn-text">Sortir</span>
				</button>
			</div>
		</header>
	}

	<main class="app-content">
		<router-outlet></router-outlet>
	</main>

	<app-profile></app-profile>
</div>
