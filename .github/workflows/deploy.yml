name: ADF247 CI/CD

on:
  push:
    branches:
      - release/firebase-migration
      - ieavueling-fix-docker-build

  pull_request:
    branches:
      - master

jobs:
  # ============================================================
  # ANGULAR
  # ============================================================
  angular:
    name: Angular - Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build


  dotnet:
    name: .NET - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build services and database migrator
        run: dotnet build dotnet-services/ADF247.slnx --configuration Release


  deploy-pre:
    name: Deploy PRE
    needs:
      - angular
      - dotnet

    runs-on:
      - self-hosted
      - linux
      - x64
      - production
      - adf247

    environment: pre

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy PRE
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_WEB_CONFIG_JSON: ${{ secrets.FIREBASE_WEB_CONFIG_JSON }}
          FIREBASE_WEB_VAPID_KEY: ${{ secrets.FIREBASE_WEB_VAPID_KEY }}
        run: .github/scripts/deploy-stage.sh pre

  deploy-production:
    name: Deploy PRO
    needs: deploy-pre

    runs-on:
      - self-hosted
      - linux
      - x64
      - production
      - adf247

    environment: production
    if: github.ref == 'refs/heads/release/firebase-migration'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy PRO
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_WEB_CONFIG_JSON: ${{ secrets.FIREBASE_WEB_CONFIG_JSON }}
          FIREBASE_WEB_VAPID_KEY: ${{ secrets.FIREBASE_WEB_VAPID_KEY }}
        run: .github/scripts/deploy-stage.sh pro
