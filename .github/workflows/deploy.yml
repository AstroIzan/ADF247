name: ADF247 CI/CD

on:
  push:
    branches:
      - release/firebase-migration

  pull_request:
    branches:
      - master

jobs:
  # ============================================================
  # API
  # ============================================================
  api:
    name: API - Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=ADF247;user=ci;password=ci;encrypt=false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Install Database dependencies
        working-directory: database
        run: npm ci

      - name: Generate Prisma client
        working-directory: database
        run: npx prisma generate

      - name: API tests
        run: npm test


  # ============================================================
  # ANGULAR
  # ============================================================
  angular:
    name: Angular - Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build


  # ============================================================
  # DATABASE / PRISMA
  # ============================================================
  database:
    name: Database - Prisma
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: database

    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=ADF247;user=ci;password=ci;encrypt=false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: database/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate


  deploy-pre:
    name: Deploy PRE
    needs:
      - api
      - angular
      - database

    runs-on:
      - self-hosted
      - linux
      - x64
      - production
      - adf247

    environment: pre

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy PRE
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: .github/scripts/deploy-stage.sh pre

  deploy-production:
    name: Deploy PRO
    needs: deploy-pre

    runs-on:
      - self-hosted
      - linux
      - x64
      - production
      - adf247

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy PRO
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: .github/scripts/deploy-stage.sh pro