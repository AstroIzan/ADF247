name: Deploy Raspberry

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      full_deploy:
        description: "Force full deploy (db prepare + frontend build + backend restart)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-raspberry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.filter.outputs.database }}
      api: ${{ steps.filter.outputs.api }}
      client: ${{ steps.filter.outputs.client }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            database:
              - 'database/**'
            api:
              - 'api/**'
              - 'pm2.ecosystem.config.cjs'
            client:
              - 'client/**'
            deploy:
              - '**'

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    needs: changes
    steps:
      - uses: actions/checkout@v4

      - name: Deploy locally on Raspberry
        env:
          DB_CHANGED: ${{ needs.changes.outputs.database }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          CLIENT_CHANGED: ${{ needs.changes.outputs.client }}
          DEPLOY_CHANGED: ${{ needs.changes.outputs.deploy }}
          FORCE_FULL_DEPLOY: ${{ github.event.inputs.full_deploy || 'false' }}
        run: |
          set -euo pipefail

          BRANCH="${{ github.ref_name }}"
          TARGET_DIR="/opt/ADF247"

          if [ "${FORCE_FULL_DEPLOY}" = "true" ]; then
            DEPLOY_CHANGED="true"
            DB_CHANGED="true"
            API_CHANGED="true"
            CLIENT_CHANGED="true"
          fi

          if [ "${DEPLOY_CHANGED}" != "true" ]; then
            echo "No changes. Skipping deploy."
            exit 0
          fi

          cd "${TARGET_DIR}"

          git fetch origin "${BRANCH}"
          git checkout "${BRANCH}"
          
          # Clean up any local modifications to ignored files (e.g., generated Prisma client)
          # This prevents merge conflicts when pulling after files are added to .gitignore
          echo "Cleaning local state..."
          git clean -fd database/generated/
          git reset --hard "origin/${BRANCH}"

          CACHE_DIR="${TARGET_DIR}/.deploy-cache"
          mkdir -p "${CACHE_DIR}"

          ensure_npm_deps() {
            local project_dir="$1"
            local install_mode="${2:-ci}"
            local project_path="${TARGET_DIR}/${project_dir}"
            local lock_file="${project_path}/package-lock.json"
            local cache_key
            local current_lock_hash
            local previous_lock_hash=""

            if [ ! -d "${project_path}" ]; then
              echo "[deps] Skipping ${project_dir}: directory not found"
              return 0
            fi

            if [ ! -f "${lock_file}" ]; then
              echo "[deps] Skipping ${project_dir}: package-lock.json not found"
              return 0
            fi

            cache_key="$(echo "${project_dir}" | tr '/.' '__')"
            current_lock_hash="$(sha256sum "${lock_file}" | awk '{print $1}')"

            if [ -f "${CACHE_DIR}/${cache_key}.sha256" ]; then
              previous_lock_hash="$(cat "${CACHE_DIR}/${cache_key}.sha256")"
            fi

            if [ -d "${project_path}/node_modules" ] && [ "${current_lock_hash}" = "${previous_lock_hash}" ]; then
              echo "[deps] ${project_dir}: lockfile unchanged, reusing existing node_modules"
              return 0
            fi

            echo "[deps] ${project_dir}: installing dependencies (${install_mode})"
            (
              cd "${project_path}"

              if [ "${install_mode}" = "install" ]; then
                npm install --prefer-offline --no-audit --no-fund || npm ci --no-audit --no-fund
              else
                npm ci --no-audit --no-fund
              fi
            )
            echo "${current_lock_hash}" > "${CACHE_DIR}/${cache_key}.sha256"
          }

          if [ "${DB_CHANGED}" = "true" ]; then
            echo "Applying DB changes..."
            ensure_npm_deps "database" "ci"
            npm run db:prepare:pro
          fi

          if [ "${API_CHANGED}" = "true" ]; then
            ensure_npm_deps "api" "ci"
          fi

          if [ "${CLIENT_CHANGED}" = "true" ]; then
            echo "Building frontend (clean)..."
            ensure_npm_deps "client" "install"
            cd client
            rm -rf dist
            npm run build
            cd ..
          fi

          if pm2 describe adf247-pro >/dev/null 2>&1; then
            if [ "${API_CHANGED}" = "true" ] || [ "${DB_CHANGED}" = "true" ]; then
              pm2 restart adf247-pro --update-env
            fi
          else
            pm2 start pm2.ecosystem.config.cjs --only adf247-pro
          fi

          pm2 save